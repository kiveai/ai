name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Check provider skill copies are in sync
        run: node scripts/sync.js --check

      - name: Validate skills against the Agent Skills spec
        run: |
          for skill in skills/*/; do
            [ -d "$skill" ] || continue
            npx --yes skills-ref@0.1.5 validate "$skill"
          done

      - name: Test Agent Skills release artifacts
        run: node --test scripts/build-release.test.js

      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/marketplace.json providers/claude/plugin/.claude-plugin/plugin.json providers/claude/plugin/.mcp.json; do
            node -e "JSON.parse(require('node:fs').readFileSync('$f', 'utf8'))" && echo "ok $f"
          done
